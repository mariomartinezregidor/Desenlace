<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desenlace</title>
<style>
  :root {
    --fondo: #0d1017;
    --fondo-2: #131824;
    --panel: #191f2c;
    --panel-2: #1f2635;
    --borde: #2b3446;
    --texto: #eef1f8;
    --suave: #98a3ba;
    --acento: #5b8cff;
    --acento-2: #8a6bff;
    --ok: #35d07f;
    --error: #ff6b7a;
    --warn: #ffc857;
    --sombra: 0 18px 46px rgba(0, 0, 0, .38);
  }
  [data-theme="light"] {
    --fondo: #eef1f8;
    --fondo-2: #e3e8f2;
    --panel: #ffffff;
    --panel-2: #f6f8fc;
    --borde: #d5dce8;
    --texto: #162031;
    --suave: #5d6a80;
    --acento: #3568e8;
    --acento-2: #7048e8;
    --ok: #119a5a;
    --error: #d83a52;
    --warn: #b7791f;
    --sombra: 0 18px 42px rgba(40, 60, 100, .13);
  }
  html { color-scheme: dark light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 540px at 12% -12%, rgba(91, 140, 255, .16), transparent 60%),
      radial-gradient(900px 500px at 88% 0%, rgba(138, 107, 255, .12), transparent 58%),
      linear-gradient(180deg, var(--fondo-2), var(--fondo));
    background-attachment: fixed;
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 38px 16px 56px;
  }
  main { width: 100%; max-width: 860px; }

  /* ---------- Cabecera ---------- */
  .cabecera {
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px; margin-bottom: 26px;
  }
  .marca { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 52px; height: 52px; border-radius: 16px;
    background: linear-gradient(135deg, var(--acento), var(--acento-2));
    display: grid; place-items: center;
    font-size: 1.6rem; font-weight: 800; color: #fff;
    box-shadow: 0 10px 26px rgba(91, 140, 255, .38);
    flex-shrink: 0;
  }
  h1 { font-size: 1.55rem; margin: 0; letter-spacing: -.02em; }
  p.sub { color: var(--suave); margin: 3px 0 0; font-size: .88rem; }
  .tema {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: 999px; width: 44px; height: 44px; padding: 0;
    font-size: 1.1rem; cursor: pointer; transition: transform .18s, border-color .18s;
  }
  .tema:hover { transform: rotate(18deg); border-color: var(--acento); }

  /* ---------- Paneles ---------- */
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--borde);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: var(--sombra);
    animation: subir .35s ease both;
  }
  @keyframes subir {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  label.titulo {
    display: flex; align-items: center; gap: 8px;
    font-size: .78rem; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--suave); margin-bottom: 10px;
  }
  textarea {
    width: 100%; min-height: 150px; resize: vertical;
    background: rgba(0, 0, 0, .2); color: var(--texto);
    border: 1px solid var(--borde); border-radius: 12px;
    padding: 14px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: .85rem; line-height: 1.6; transition: border-color .2s, box-shadow .2s;
  }
  [data-theme="light"] textarea { background: #fbfcff; }
  textarea:focus {
    outline: none; border-color: var(--acento);
    box-shadow: 0 0 0 3px rgba(91, 140, 255, .16);
  }
  .fila { display: flex; gap: 10px; align-items: center; }
  .fila + .fila { margin-top: 14px; }
  input[type="text"] {
    flex: 1; background: rgba(0, 0, 0, .2); color: var(--texto);
    border: 1px solid var(--borde); border-radius: 11px;
    padding: 12px 14px; font-size: .86rem;
    transition: border-color .2s, box-shadow .2s;
  }
  [data-theme="light"] input[type="text"] { background: #fbfcff; }
  input[type="text"]:focus {
    outline: none; border-color: var(--acento);
    box-shadow: 0 0 0 3px rgba(91, 140, 255, .16);
  }
  button {
    border: 1px solid var(--borde);
    background: var(--panel-2); color: var(--texto);
    border-radius: 11px; padding: 11px 17px;
    font-size: .86rem; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: transform .16s, border-color .16s, background .16s;
  }
  button:hover:not(:disabled) { border-color: var(--acento); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.principal {
    position: relative; overflow: hidden;
    background: linear-gradient(110deg, var(--acento), var(--acento-2));
    border: none; color: #fff; font-size: .98rem; font-weight: 700;
    width: 100%; padding: 15px; margin-top: 18px;
    box-shadow: 0 12px 28px rgba(91, 140, 255, .3);
  }
  button.principal::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.22), transparent 80%);
    transform: translateX(-120%); transition: transform .6s;
  }
  button.principal:hover::after { transform: translateX(120%); }
  button.peligro { border-color: var(--error); color: var(--error); }

  /* ---------- Opciones ---------- */
  .opciones {
    margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 13px; border-radius: 999px;
    border: 1px solid var(--borde); background: var(--panel-2);
    font-size: .8rem; color: var(--suave); cursor: pointer;
    transition: all .18s; user-select: none;
  }
  .chip span::before {
    content: ""; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--borde); transition: all .18s;
  }
  .chip input:checked + span {
    color: var(--texto); border-color: var(--acento);
    background: rgba(91, 140, 255, .12);
  }
  .chip input:checked + span::before {
    background: var(--acento); border-color: var(--acento);
    box-shadow: inset 0 0 0 3px var(--panel);
  }
  .atenuado { opacity: .45; }

  /* ---------- Progreso ---------- */
  .meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: .82rem; color: var(--suave); margin-bottom: 9px; gap: 10px;
  }
  .meta strong { color: var(--texto); font-weight: 600; }
  .badges { display: flex; gap: 7px; }
  .badge {
    padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700;
    background: rgba(91, 140, 255, .12); color: var(--acento);
  }
  .badge.ok { background: rgba(53, 208, 127, .14); color: var(--ok); }
  .badge.err { background: rgba(255, 107, 122, .14); color: var(--error); }
  .barra {
    height: 12px; background: rgba(0, 0, 0, .28);
    border: 1px solid var(--borde); border-radius: 999px;
    overflow: hidden; position: relative;
  }
  [data-theme="light"] .barra { background: #e8ecf4; }
  .barra > div {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--acento), var(--acento-2));
    box-shadow: 0 0 14px rgba(91, 140, 255, .55);
    transition: width .3s ease;
  }
  .barra.indeterminada > div {
    width: 35% !important; animation: deslizar 1.15s infinite ease-in-out;
  }
  @keyframes deslizar {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(330%); }
  }
  .porcentaje { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--acento); }
  .archivo-actual {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel-2); border: 1px solid var(--borde);
    border-radius: 12px; padding: 12px 14px; margin: 16px 0 12px;
  }
  .icono-archivo {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--acento), var(--acento-2));
    display: grid; place-items: center; font-size: 1.1rem;
  }
  .archivo-actual .detalle { min-width: 0; flex: 1; }
  .archivo-actual .nombre {
    font-size: .86rem; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .archivo-actual .subnombre { font-size: .74rem; color: var(--suave); margin-top: 2px; }
  .log {
    margin-top: 16px; max-height: 210px; overflow: auto;
    background: rgba(0, 0, 0, .26); border: 1px solid var(--borde);
    border-radius: 12px; padding: 13px 15px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: .76rem; line-height: 1.65; white-space: pre-wrap;
    word-break: break-word; color: var(--suave);
    scrollbar-width: thin;
  }
  [data-theme="light"] .log { background: #f7f9fd; }
  .log .ok { color: var(--ok); }
  .log .err { color: var(--error); }
  .log .aviso { color: var(--warn); }
  .estado-final {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 13px; border-radius: 999px; font-size: .82rem; font-weight: 700;
    background: rgba(53, 208, 127, .13); color: var(--ok);
  }
  .estado-final.error { background: rgba(255, 107, 122, .13); color: var(--error); }
  .oculto { display: none !important; }

  /* ---------- Resultados ---------- */
  .cabecera-resultados {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .tarjetas { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .tarjeta {
    background: var(--panel-2); border: 1px solid var(--borde);
    border-radius: 14px; padding: 15px; position: relative;
    animation: subir .4s ease both; transition: transform .18s, border-color .18s;
  }
  .tarjeta:hover { transform: translateY(-3px); border-color: var(--acento); }
  .tarjeta::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--ok);
  }
  .tarjeta.error::before { background: var(--error); }
  .tarjeta .sup { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tarjeta .emoji {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: rgba(53, 208, 127, .14); font-size: 1.05rem; flex-shrink: 0;
  }
  .tarjeta.error .emoji { background: rgba(255, 107, 122, .14); }
  .tarjeta .nom {
    font-size: .85rem; font-weight: 700; word-break: break-word;
    line-height: 1.35; flex: 1;
  }
  .tarjeta .meta-linea {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: .73rem; color: var(--suave); margin-top: 6px;
  }
  .enlace-final {
    font-family: ui-monospace, Menlo, monospace; font-size: .7rem;
    color: var(--acento); word-break: break-all; margin-top: 10px;
    background: rgba(91, 140, 255, .08); padding: 7px 9px; border-radius: 8px;
  }
  .tarjeta button {
    margin-top: 11px; width: 100%; padding: 8px; font-size: .76rem;
  }
  .acciones { display: flex; gap: 10px; margin-top: 16px; }

  @media (max-width: 640px) {
    body { padding: 20px 12px 40px; }
    .panel { padding: 16px; border-radius: 14px; }
    .fila { flex-direction: column; align-items: stretch; }
    .opciones { flex-direction: column; align-items: flex-start; }
    h1 { font-size: 1.3rem; }
    .logo { width: 44px; height: 44px; font-size: 1.3rem; }
  }
</style>
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("desenlace-tema") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));</script>
</head>
<body>
<main>
  <div class="cabecera">
    <div class="marca">
      <div class="logo">D</div>
      <div>
        <h1>Desenlace</h1>
        <p class="sub">Pega los enlaces, elige la carpeta del PC y pulsa Descargar.</p>
      </div>
    </div>
    <button id="btnTema" type="button" class="tema" aria-label="Cambiar tema">🌙</button>
  </div>

  <section class="panel">
    <label class="titulo" for="enlaces">🔗 Enlaces (uno por línea)</label>
    <textarea id="enlaces" placeholder="https://softurl.in/XXXX&#10;https://web-api-13.vercel.app/?url=https://softurl.in/YYYY"></textarea>

    <div class="fila" style="margin-top:16px" id="filaCarpeta">
      <input type="text" id="carpeta" placeholder="Carpeta de destino" readonly>
      <button id="btnCarpeta" type="button">📁 Seleccionar carpeta</button>
    </div>

    <div class="opciones">
      <label class="chip"><input type="checkbox" id="soloEnlace"><span>Solo enlace final</span></label>
      <label class="chip"><input type="checkbox" id="force"><span>Sobrescribir</span></label>
      <label class="chip"><input type="checkbox" id="browser"><span>Navegador</span></label>
      <label class="chip"><input type="checkbox" id="autoBrowser"><span>Auto-navegador</span></label>
    </div>

    <button class="principal" id="btnDescargar" type="button">⬇ Descargar</button>
  </section>

  <section class="panel oculto" id="panelProgreso">
    <div class="meta">
      <span id="textoEnlaces">0/0 enlaces</span>
      <span class="badges">
        <span class="badge ok" id="badgeOk">0 ✓</span>
        <span class="badge err" id="badgeErr">0 ✕</span>
      </span>
    </div>
    <div class="meta">
      <span id="textoEstado">Preparando…</span>
      <span class="porcentaje" id="textoPct">0%</span>
    </div>
    <div class="barra" id="barraGlobal"><div id="progresoGlobal"></div></div>

    <div class="archivo-actual">
      <div class="icono-archivo">📄</div>
      <div class="detalle">
        <div class="nombre" id="textoArchivo">Archivo actual: —</div>
        <div class="subnombre" id="textoBytes">Esperando…</div>
      </div>
    </div>
    <div class="barra" id="barraArchivo"><div id="progresoArchivo"></div></div>

    <div class="log" id="log"></div>
    <div class="fila" style="margin-top:16px">
      <button id="btnCancelar" class="peligro" type="button">✕ Cancelar</button>
    </div>
  </section>

  <section class="panel oculto" id="panelResultados">
    <div class="cabecera-resultados">
      <div>
        <label class="titulo" style="margin-bottom:4px">📦 Resultados</label>
        <span id="textoResultados" style="font-size:.82rem;color:var(--suave)"></span>
      </div>
      <span id="estadoFinal" class="estado-final">✓ Completado</span>
    </div>
    <div class="tarjetas" id="tarjetas"></div>
    <div class="acciones">
      <button id="btnCopiar" type="button">📋 Copiar todos los enlaces</button>
    </div>
    <textarea id="resultadosTexto" class="oculto" readonly></textarea>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let jobId = null;
let modoSolo = false;
let ultimosResultados = [];

function actualizarModo() {
  modoSolo = $("soloEnlace").checked;
  $("filaCarpeta").classList.toggle("atenuado", modoSolo);
  $("carpeta").disabled = modoSolo;
  $("btnCarpeta").disabled = modoSolo;
  $("btnDescargar").textContent = modoSolo ? "🔗 Obtener enlaces" : "⬇ Descargar";
  document.querySelector("p.sub").textContent = modoSolo
    ? "Pega los enlaces y pulsa Obtener enlaces: se resolverán sin descargar."
    : "Pega los enlaces, elige la carpeta del PC y pulsa Descargar.";
}
$("soloEnlace").addEventListener("change", actualizarModo);

function humanBytes(n) {
  if (!n) return "0 B";
  const unidades = ["B", "KB", "MB", "GB"];
  let i = 0, v = n;
  while (v >= 1024 && i < unidades.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(i === 0 ? 0 : 1)} ${unidades[i]}`;
}
function escapar(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function colorearLog(lineas) {
  return (lineas || []).map(l => {
    const s = escapar(l);
    if (/\b(error|falló|fallo|failed|exception|traceback)\b/i.test(l))
      return `<span class="err">${s}</span>`;
    if (/\b(ok|descargado|completado|guardado|éxito|success|✓)\b/i.test(l))
      return `<span class="ok">${s}</span>`;
    if (/\b(aviso|warning|atención|captcha|esperando)\b/i.test(l))
      return `<span class="aviso">${s}</span>`;
    return s;
  }).join("\n");
}
function aviso(mensaje, tipo) {
  const caja = $("log");
  caja.innerHTML = colorearLog([mensaje]);
}

function actualizarIconoTema() {
  $("btnTema").textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "🌙" : "☀️";
}
actualizarIconoTema();
$("btnTema").addEventListener("click", () => {
  const actual = document.documentElement.getAttribute("data-theme");
  const nuevo = actual === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nuevo);
  localStorage.setItem("desenlace-tema", nuevo);
  actualizarIconoTema();
});

$("btnCarpeta").addEventListener("click", async () => {
  $("btnCarpeta").disabled = true;
  try {
    const r = await fetch("/api/carpeta", { method: "POST", body: "{}" });
    const datos = await r.json();
    if (!r.ok || datos.error) { alert(datos.error || "No se pudo elegir la carpeta."); return; }
    if (datos.carpeta) $("carpeta").value = datos.carpeta;
  } catch (e) {
    alert("Error de conexión con el servidor local.");
  } finally {
    $("btnCarpeta").disabled = false;
  }
});

$("btnDescargar").addEventListener("click", async () => {
  const enlaces = $("enlaces").value.trim();
  const carpeta = $("carpeta").value.trim();
  if (!enlaces) { alert("Pega al menos un enlace."); return; }
  if (!carpeta && !modoSolo) { alert("Selecciona una carpeta de destino."); return; }

  $("panelProgreso").classList.remove("oculto");
  $("panelResultados").classList.add("oculto");
  $("resultadosTexto").value = "";
  $("tarjetas").innerHTML = "";
  $("textoResultados").textContent = "";
  $("log").innerHTML = "";
  $("btnDescargar").disabled = true;
  $("btnCancelar").disabled = false;
  $("barraGlobal").classList.add("indeterminada");
  $("barraArchivo").classList.add("indeterminada");
  $("progresoGlobal").style.width = "0%";
  $("progresoArchivo").style.width = "0%";
  $("textoPct").textContent = "0%";
  $("textoEstado").textContent = "Iniciando…";
  $("badgeOk").textContent = "0 ✓";
  $("badgeErr").textContent = "0 ✕";

  try {
    const r = await fetch("/api/descargar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enlaces, carpeta, force: $("force").checked, browser: $("browser").checked, autoBrowser: $("autoBrowser").checked, soloEnlace: modoSolo })
    });
    const datos = await r.json();
    if (!r.ok || datos.error) {
      $("textoEstado").textContent = "Error";
      aviso(datos.error || "No se pudo iniciar la descarga.", "error");
      $("btnDescargar").disabled = false;
      $("barraGlobal").classList.remove("indeterminada");
      $("barraArchivo").classList.remove("indeterminada");
      return;
    }
    jobId = datos.id;
    iniciarEventos();
  } catch (e) {
    $("textoEstado").textContent = "Error";
    aviso("No se pudo conectar con el servidor local.", "error");
    $("btnDescargar").disabled = false;
  }
});

$("btnCancelar").addEventListener("click", async () => {
  if (!jobId) return;
  await fetch("/api/cancelar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: jobId })
  });
  $("textoEstado").textContent = "Cancelando…";
});

let fuenteEventos = null;
function iniciarEventos() {
  if (fuenteEventos) { fuenteEventos.close(); fuenteEventos = null; }
  fuenteEventos = new EventSource(`/api/eventos?id=${encodeURIComponent(jobId)}`);
  fuenteEventos.onmessage = (ev) => {
    try { procesarEstado(JSON.parse(ev.data)); } catch (e) { /* ignorar */ }
  };
  fuenteEventos.onerror = () => {
    if (fuenteEventos) { fuenteEventos.close(); fuenteEventos = null; }
  };
}

function procesarEstado(datos) {
  if (!jobId || !datos) return;

  const terminado = datos.estado !== "en_curso";
  const procesados = (datos.completados || 0) + (datos.fallidos || 0);
  const pctGlobal = datos.total ? Math.round(procesados / datos.total * 100) : 0;

  if (procesados > 0 || terminado) {
    $("barraGlobal").classList.remove("indeterminada");
    $("progresoGlobal").style.width = pctGlobal + "%";
  }
  $("textoPct").textContent = pctGlobal + "%";
  $("textoEnlaces").textContent = `${procesados}/${datos.total} enlaces`;
  $("badgeOk").textContent = `${datos.completados || 0} ✓`;
  $("badgeErr").textContent = `${datos.fallidos || 0} ✕`;

  if (datos.descargado > 0 && datos.total_bytes > 0) {
    $("barraArchivo").classList.remove("indeterminada");
    const pct = Math.min(100, Math.round(datos.descargado / datos.total_bytes * 100));
    $("progresoArchivo").style.width = pct + "%";
  }
  $("textoArchivo").textContent = (modoSolo ? "🔗 " : "📄 ") + (datos.archivo || "—");
  $("textoBytes").textContent = datos.total_bytes
    ? `${humanBytes(datos.descargado)} / ${humanBytes(datos.total_bytes)}`
    : (datos.descargado ? humanBytes(datos.descargado) : "Esperando…");

  $("log").innerHTML = colorearLog(datos.log);
  $("log").scrollTop = $("log").scrollHeight;

  if (terminado) {
    if (fuenteEventos) { fuenteEventos.close(); fuenteEventos = null; }
    $("barraGlobal").classList.remove("indeterminada");
    $("barraArchivo").classList.remove("indeterminada");
    $("progresoGlobal").style.width = "100%";
    $("textoPct").textContent = "100%";
    $("btnDescargar").disabled = false;
    $("btnCancelar").disabled = true;
    const etiquetas = {
      terminado: "✓ Completado",
      terminado_con_errores: "⚠ Completado con errores",
      cancelado: "✕ Cancelado"
    };
    $("textoEstado").textContent = `${etiquetas[datos.estado] || datos.estado} · ${datos.transcurrido}s`;
    const badge = $("estadoFinal");
    badge.textContent = etiquetas[datos.estado] || datos.estado;
    badge.classList.toggle("error", !!datos.fallidos);
    mostrarResultados(datos.resultados);
  } else {
    $("textoEstado").textContent = `${modoSolo ? "Resolviendo" : "Descargando"} ${datos.indice}/${datos.total} · ${datos.transcurrido}s`;
  }
}

function mostrarResultados(resultados) {
  const lista = resultados || [];
  if (!lista.length) return;
  ultimosResultados = lista;
  const contenedor = $("tarjetas");
  contenedor.innerHTML = lista.map((r, i) => {
    const ok = r.estado === "ok";
    const nombre = ok ? (r.archivo || "Archivo descargado") : (r.error || "Error");
    const tiempo = r.transcurrido ? `${Number(r.transcurrido).toFixed(1)}s` : "—";
    const enlace = r.final || r.enlace || "";
    return `<article class="tarjeta ${ok ? "" : "error"}" style="animation-delay:${i * 45}ms">
      <div class="sup">
        <div class="emoji">${ok ? "✅" : "❌"}</div>
        <div class="nom">${escapar(nombre)}</div>
      </div>
      <div class="meta-linea"><span>${ok ? "Descargado" : "Fallido"}</span><span>${tiempo}</span></div>
      ${enlace ? `<div class="enlace-final" title="${escapar(enlace)}">${escapar(enlace.length > 90 ? enlace.slice(0, 87) + "…" : enlace)}</div>` : ""}
      ${enlace ? `<button type="button" onclick="copiarUno(${i})">📋 Copiar enlace</button>` : ""}
    </article>`;
  }).join("");
  const okCount = lista.filter(r => r.estado === "ok").length;
  $("textoResultados").textContent = `${okCount} descargado${okCount === 1 ? "" : "s"} · ${lista.length - okCount} error${lista.length - okCount === 1 ? "" : "es"}`;
  $("resultadosTexto").value = lista.filter(r => r.estado === "ok" && r.final).map(r => r.final).join("\n");
  $("panelResultados").classList.remove("oculto");
}

function copiarUno(i) {
  const r = ultimosResultados[i];
  const texto = r ? (r.final || r.enlace || "") : "";
  if (!texto) return;
  navigator.clipboard.writeText(texto).catch(() => {});
}

$("btnCopiar").addEventListener("click", async () => {
  const texto = $("resultadosTexto").value;
  if (!texto) return;
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    $("resultadosTexto").classList.remove("oculto");
    $("resultadosTexto").select();
    document.execCommand("copy");
    $("resultadosTexto").classList.add("oculto");
  }
  $("btnCopiar").textContent = "✓ Copiado";
  setTimeout(() => { $("btnCopiar").textContent = "📋 Copiar todos los enlaces"; }, 1500);
});
</script>
</body>
